[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pde-option-pricer"
version = "0.1.0"
description = "Crank-Nicolson finite-difference pricer for European options under Black-Scholes, with Rannacher startup and a strike-concentrated grid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pde_option_pricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
